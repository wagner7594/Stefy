<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Para mi querida Amiguaa</title>
        <link rel="stylesheet" href="../css/estilos3.css">
    </head>
    <body>
        <main>
            <!-- IMAGEN QUE LLEGA GIRANDO DESDE LA DERECHA -->
            <img src="" alt="" class="img-voladora" id="imgVoladora">

            <!-- IMAGEN IZQUIERDA FIJA -->
            <div class="lado-izq">
                <img src="" alt="" class="foto-lado" id="fotoIzq">
            </div>

            <!-- CUADRO CENTRAL CON MENSAJE Y BOTONES -->
            <div class="cuadro-central">
                <p class="mensaje" id="mensaje">Aquí va tu mensaje 💌</p>
                <div class="botones">
                    <button type="button" id="btnRegresar">⟵ Regresar</button>
                    <button type="button" id="btnContinuar">Continuar ⟶</button>
                </div>
                
            </div>

            <!-- IMAGEN DERECHA FIJA -->
            <div class="lado-der">
                <img src="" alt="" class="foto-lado" id="fotoDer">
            </div>
        </main>

        <script src="../js/script3.js"></script>
    </body>
</html>
